 <script language="JavaScript">function getParameterByName(b){b=b.replace(/[\[]/,"\\[").replace(/[\]]/,"\\]");var a="[\\?&]"+b+"=([^&#]*)";var d=new RegExp(a);var c=d.exec(window.location.href);if(c==null){return""}else{return decodeURIComponent(c[1].replace(/\+/g," "))}}var adurl=getParameterByName("url");if(adurl.length>0){document.write('<img src="'+adurl+'" style="display: none" height="1" width="1" border="0">')};</script></body></html><!--
